# Analyse statique du paquet Dart pur `task_cli`.
# Docs : https://dart.dev/guides/language/analysis-options

include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  exclude:
    - build/**

linter:
  rules:
    # Une application CLI s'appuie sur print() pour son interface console :
    # le lint avoid_print n'est pas pertinent ici.
    avoid_print: false
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_function_literals_in_foreach_calls: true
    prefer_final_locals: true
    unawaited_futures: true
